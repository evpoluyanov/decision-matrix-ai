# Isolated My Food release branch. Do not deploy the unrelated Decision Matrix AI project.
name: Deploy My Food to Cloudflare

on:
  push:
    branches: [codex/my-food-cloudflare-cicd]
    paths:
      - 'my-food/**'
      - '.github/workflows/deploy-my-food.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-food-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determine changed components
        id: components
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          worker=false
          pages=false
          if [[ "$EVENT" == "workflow_dispatch" || -z "${BEFORE:-}" || "$BEFORE" == '0000000000000000000000000000000000000000' ]]; then
            worker=true
            pages=true
          else
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > /tmp/my-food-changes.txt
            if grep -qE '^my-food/worker/|^\.github/workflows/deploy-my-food\.yml$' /tmp/my-food-changes.txt; then worker=true; fi
            if grep -qE '^my-food/site/|^my-food/site-worker/|^\.github/workflows/deploy-my-food\.yml$' /tmp/my-food-changes.txt; then pages=true; fi
          fi
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "Worker changed: $worker; PWA changed: $pages"
      - name: Syntax check
        run: |
          node --check my-food/worker/worker.js
          node --check my-food/worker/prompt.js
          node --check my-food/site/app.js
          node --check my-food/site/sw.js
          node --check my-food/site-worker/index.js
      - name: Regression tests (no Cloudflare calls)
        run: |
          node my-food/tests/test-ai-first.mjs
          node my-food/tests/test-ai-first-app.mjs
          node my-food/tests/test-worker-nutrition.mjs
      - name: User workflow tests
        run: node my-food/tests/test-ui-workflow.mjs
      - name: Require Cloudflare credentials
        if: steps.components.outputs.worker == 'true' || steps.components.outputs.pages == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing secret CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing secret CLOUDFLARE_API_TOKEN'; exit 1; }
      - name: Deploy existing Worker
        if: steps.components.outputs.worker == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config my-food/worker/wrangler.toml
      - name: Deploy existing PWA Worker with static assets
        if: steps.components.outputs.pages == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config my-food/site-worker/wrangler.toml
      - name: Live AI response smoke test (no blocking nutrition comparisons)
        if: steps.components.outputs.worker == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # A partial meal is a valid result; only HTTP/network or malformed JSON is a failure.
          curl -fsS --max-time 110 --form-string 'text=Блинчики с творогом (2шт), 20 г сметаны, 4 гренки, 100 г мортаделлы, 30 г сыра, 15 г масла 85% жирности, 10г меда, 20 г грецких орехов' \
            -o /tmp/my-food-smoke.json https://food-ai-inference.evpoluyanov.workers.dev/analyze
          node -e 'const j=JSON.parse(require("fs").readFileSync("/tmp/my-food-smoke.json","utf8"));if(!j.ok||!Array.isArray(j.food?.dishes)||!j.food.dishes.length)process.exit(1);console.log("Meal response accepted:",j.status,j.food.dishes.map(x=>x.name));'
      - name: Live photographed food text (informational)
        if: steps.components.outputs.worker == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsS --max-time 95 -F 'photo=@my-food/tests/fixture-text-photo.jpg;type=image/jpeg' \
            -o /tmp/my-food-photo.json https://food-ai-inference.evpoluyanov.workers.dev/analyze; then
            node -e 'const j=JSON.parse(require("fs").readFileSync("/tmp/my-food-photo.json","utf8"));console.log("Photo mode:",j.food?.input_mode,"Recognized:",j.food?.recognized_text,"Dishes:",j.food?.dishes?.length);'
          else
            echo 'Photo model temporarily unavailable — text pipeline unaffected'
          fi
      - name: Verify deployed PWA version
        if: steps.components.outputs.pages == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 -o /tmp/my-food-index.html https://drop-443886b1-4e5.evpoluyanov.workers.dev/
          grep -q 'v0.10.3' /tmp/my-food-index.html
          echo 'PWA v0.10.3 deployed and accessible'
