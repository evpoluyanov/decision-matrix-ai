# Isolated My Food release branch. Do not deploy the unrelated Decision Matrix AI project.
name: Deploy My Food to Cloudflare

on:
  push:
    branches: [codex/my-food-cloudflare-cicd]
    paths:
      - 'my-food/**'
      - '.github/workflows/deploy-my-food.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-food-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determine changed components
        id: components
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          worker=false
          pages=false
          if [[ "$EVENT" == "workflow_dispatch" || -z "${BEFORE:-}" || "$BEFORE" == '0000000000000000000000000000000000000000' ]]; then
            worker=true
            pages=true
          else
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > /tmp/my-food-changes.txt
            if grep -qE '^my-food/worker/|^\.github/workflows/deploy-my-food\.yml$' /tmp/my-food-changes.txt; then worker=true; fi
            if grep -qE '^my-food/site/|^my-food/site-worker/|^\.github/workflows/deploy-my-food\.yml$' /tmp/my-food-changes.txt; then pages=true; fi
          fi
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "Worker changed: $worker; PWA changed: $pages"
      - name: Syntax check
        run: |
          node --check my-food/worker/worker.js
          node --check my-food/site/app.js
          node --check my-food/site/sw.js
          node --check my-food/site-worker/index.js
      - name: Regression tests (no Cloudflare calls)
        run: |
          node my-food/tests/test-ai-first.mjs
          node my-food/tests/test-ai-first-app.mjs
          node my-food/tests/test-worker-nutrition.mjs
      - name: Require Cloudflare credentials
        if: steps.components.outputs.worker == 'true' || steps.components.outputs.pages == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing secret CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing secret CLOUDFLARE_API_TOKEN'; exit 1; }
      - name: Deploy existing Worker
        if: steps.components.outputs.worker == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config my-food/worker/wrangler.toml
      - name: Deploy existing PWA Worker with static assets
        if: steps.components.outputs.pages == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config my-food/site-worker/wrangler.toml
      - name: Live AI-first per100 text tests
        if: steps.components.outputs.worker == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for mode in multi composite; do
            if [ "$mode" = multi ]; then
              source='2 яйца, 20 г печени трески и соус тартар 10г'
            else
              source='2 блина, каждый с начинкой из чайной ложки творожного сыра и кусочком слабосоленой семги'
            fi
            passed=false
            for attempt in 1 2; do
              if curl -fsS --max-time 100 --form-string "text=$source" \
                -o /tmp/my-food-ai-live.json https://food-ai-inference.evpoluyanov.workers.dev/analyze && \
                node my-food/tests/check-live.mjs /tmp/my-food-ai-live.json "$mode"; then
                passed=true
                break
              fi
              echo "AI-first live test for $mode, attempt $attempt failed"
              sleep 2
            done
            if [ "$passed" != true ]; then exit 1; fi
          done
      - name: Live nutrition database availability (informational)
        if: steps.components.outputs.worker == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Databases occasionally return 429/503. That must NOT fail a healthy
          # AI-first deployment: reference sources are independent diagnostics.
          if curl -fsS --max-time 45 --get --data-urlencode 'q=Печень трески' \
            -o /tmp/my-food-nutrition.json https://food-ai-inference.evpoluyanov.workers.dev/nutrition-search; then
            node -e 'const j=JSON.parse(require("fs").readFileSync("/tmp/my-food-nutrition.json","utf8"));const good=(j.items||[]).find(x=>/cod liver|печень трески/i.test(x.name+" "+(x.name_ru||""))&&!/\boil\b|\bpate\b/i.test(x.name||"")&&x.k>250&&x.f>20);if(good)console.log("Reference available",good.name,good.k);else console.log("Reference temporarily unavailable; AI values remain unchanged",j.diagnostics);'
          else
            echo 'Reference search temporarily unavailable; AI values remain unchanged'
          fi
      - name: Live photographed text exact-label test
        if: steps.components.outputs.worker == 'true' 
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 100 \
            -F "photo=@my-food/tests/fixture-text-photo.jpg;type=image/jpeg" \
            -o /tmp/my-food-photo-ocr.json https://food-ai-inference.evpoluyanov.workers.dev/analyze
          node -e 'const j=JSON.parse(require("fs").readFileSync("/tmp/my-food-photo-ocr.json","utf8"));const d=j.food?.dishes||[];if(!j.ok||j.food?.input_mode!=="photo_text"||!d.length||d[0].weight_g!==150||d[0].per100?.k!==120||d[0].per100?.p!==17||d[0].per100?.f!==5||d[0].per100?.c!==2){console.error("OCR/photo text incomplete",JSON.stringify(j).slice(0,1800));process.exit(1)}console.log("Photo text read by AI",j.food.recognized_text,d.map(x=>[x.name,x.weight_g,x.per100]));'
      - name: Verify deployed PWA version
        if: steps.components.outputs.pages == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 -o /tmp/my-food-index.html https://drop-443886b1-4e5.evpoluyanov.workers.dev/
          grep -q 'v0.10.0' /tmp/my-food-index.html
          echo 'PWA v0.10.0 deployed and accessible'
