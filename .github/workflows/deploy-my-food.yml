# Isolated My Food release branch. Do not deploy the unrelated Decision Matrix AI project.
name: Deploy My Food to Cloudflare

on:
  push:
    branches: [codex/my-food-cloudflare-cicd]
    paths:
      - 'my-food/**'
      - '.github/workflows/deploy-my-food.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-food-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determine changed components
        id: components
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          worker=false
          pages=false
          if [[ "$EVENT" == "workflow_dispatch" || -z "${BEFORE:-}" || "$BEFORE" == '0000000000000000000000000000000000000000' ]]; then
            worker=true
            pages=true
          else
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > /tmp/my-food-changes.txt
            if grep -qE '^my-food/worker/|^\.github/workflows/deploy-my-food\.yml$' /tmp/my-food-changes.txt; then worker=true; fi
            if grep -qE '^my-food/site/|^my-food/site-worker/|^\.github/workflows/deploy-my-food\.yml$' /tmp/my-food-changes.txt; then pages=true; fi
          fi
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "Worker changed: $worker; PWA changed: $pages"
      - name: Syntax check
        run: |
          node --check my-food/worker/worker.js
          node --check my-food/site/app.js
          node --check my-food/site/sw.js
          node --check my-food/site-worker/index.js
      - name: Regression tests (no Cloudflare calls)
        run: node my-food/tests/test-coverage.mjs
      - name: Require Cloudflare credentials
        if: steps.components.outputs.worker == 'true' || steps.components.outputs.pages == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing secret CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing secret CLOUDFLARE_API_TOKEN'; exit 1; }
      - name: Deploy existing Worker
        if: steps.components.outputs.worker == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config my-food/worker/wrangler.toml
      - name: Deploy existing PWA Worker with static assets
        if: steps.components.outputs.pages == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config my-food/site-worker/wrangler.toml
      - name: Live Cloudflare AI completeness test
        if: steps.components.outputs.worker == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if curl -fsS --max-time 90 --form-string 'text=2 яйца, 20 г печени трески и соус тартар 10г' \
                -o /tmp/my-food-smoke.json \
                https://food-ai-inference.evpoluyanov.workers.dev/analyze && \
               node -e 'const j=JSON.parse(require("fs").readFileSync("/tmp/my-food-smoke.json","utf8"));const d=j.food?.dishes||[];const n=s=>String(s||"").toLowerCase().replaceAll("ё","е");const f=q=>d.find(x=>q.test(n(x.name)));const a=f(/яйц/),b=f(/печен.*треск/),c=f(/тартар/);if(!j.ok||!a||!b||!c||!(a.main_weight_g>0)||b.main_weight_g!==20||c.main_weight_g!==10){console.error("Incomplete model reply",JSON.stringify({names:d.map(x=>x.name),coverage:j.coverage,stage:j.stage,message:j.message}));process.exit(1)};console.log("Real Cloudflare AI recognized all three products; masses",d.map(x=>[x.name,x.main_weight_g]));'; then
              exit 0
            fi
            echo "Cloudflare AI completeness check attempt $attempt did not pass"
            sleep 2
          done
          echo 'Cloudflare real-AI check failed after 2 attempts' >&2
          exit 1
