{% extends "base.html" %}

{% block title %}
Вход — Decision Matrix AI
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h1 class="h3 mb-3">
                    Вход
                </h1>

                {% if error %}
                    <div
                        class="alert alert-danger"
                        role="alert"
                    >
                        {{ error }}
                    </div>
                {% endif %}

                <form
                    method="post"
                    action="/login"
                >
                    <div class="mb-3">
                        <label
                            for="email"
                            class="form-label"
                        >
                            Электронная почта
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            value="{{ email }}"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label
                            for="password"
                            class="form-label"
                        >
                            Пароль
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Войти
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
