<script>
(() => {
    const counterId = {{ metrika_counter_id | tojson }};
    if (typeof window.ym !== 'function') {
        window.ym = function() { (window.ym.a = window.ym.a || []).push(arguments); };
        window.ym.l = Date.now();
        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://mc.yandex.ru/metrika/tag.js';
        document.head.appendChild(script);
        window.ym(counterId, 'init', {
            defer: true, webvisor: false, clickmap: false, trackLinks: false,
            accurateTrackBounce: false, ecommerce: false, trackHash: false
        });
    }
    const referrer = document.referrer ? document.referrer.split(/[?#]/)[0] : '';
    window.ym(counterId, 'hit', location.origin + '/', {
        title: 'Decision Matrix AI',
        referer: referrer
    });
})();
</script>
