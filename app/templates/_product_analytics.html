{% if product_analytics_counter_id %}
<script>
(function () {
    const counterId = {{ product_analytics_counter_id }};
    const consentKey = "dmatrix-analytics-consent-v1";
    window.dmatrixReachGoal = function (goal, params) {
        if (localStorage.getItem(consentKey) !== "yes" || typeof window.ym !== "function") return;
        window.ym(counterId, "reachGoal", goal, params || {});
    };
    if (localStorage.getItem(consentKey) !== "yes" || typeof window.ym === "function") return;
    window.ym = window.ym || function () {(window.ym.a = window.ym.a || []).push(arguments);};
    window.ym.l = Date.now();
    const script = document.createElement("script");
    script.async = true;
    script.src = "https://mc.yandex.ru/metrika/tag.js";
    document.head.appendChild(script);
    window.ym(counterId, "init", {
        clickmap: false, trackLinks: true, accurateTrackBounce: true,
        webvisor: false, ecommerce: false
    });
})();
</script>
{% endif %}
