{% extends "base.html" %}

{% block title %}
Главная — Decision Matrix AI
{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body">

        <h2 class="card-title">
            Создание проекта
        </h2>

        <p class="text-muted">
            Создайте проект, в рамках которого будут сравниваться варианты по выбранным критериям.
        </p>

        <form
            action="/projects"
            method="post"
        >
            <div class="mb-3">
                <label
                    for="project-name"
                    class="form-label"
                >
                    Название проекта
                </label>

                <input
                    id="project-name"
                    type="text"
                    name="project_name"
                    class="form-control"
                    placeholder="Например: выбор подрядчика"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Создать проект
            </button>
        </form>

        <a
            href="/projects"
            class="btn btn-outline-secondary mt-3"
        >
            Перейти к проектам
        </a>
    </div>

</div>

{% endblock %}
