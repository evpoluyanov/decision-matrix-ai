{% extends "base.html" %}

{% block title %}
Главная — Decision Matrix AI
{% endblock %}

{% block content %}
<h2>Создание проекта</h2>

<p>
    Создайте проект, в рамках которого будут сравниваться варианты
    по выбранным критериям.
</p>

<form action="/projects" method="post">
    <label for="project_name">Название проекта:</label>

    <input
        type="text"
        id="project_name"
        name="project_name"
        placeholder="Например: выбор подрядчика"
        required
    >

    <button type="submit">Создать проект</button>
</form>

<p>
    <a href="/projects">Перейти к проектам</a>
</p>

{% endblock %}
