{% extends "base.html" %}

{% block title %}
Личный кабинет — Decision Matrix AI
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-lg-8">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h1 class="h3 mb-3">
                    Личный кабинет
                </h1>

                <p>
                    Вы вошли как:
                    <strong>{{ user.email }}</strong>
                </p>

                <p class="text-secondary">
                    На следующем этапе здесь появятся
                    личные проекты пользователя.
                </p>

                <form
                    method="post"
                    action="/logout"
                >
                    <button
                        type="submit"
                        class="btn btn-outline-danger"
                    >
                        Выйти
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
